<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Harbor</title><link rel="stylesheet" href="styles.css?v=0.4.6b2"></head>
<body><main class="workbench">
<header><div class="brand"><img src="memory-harbor-logo-v4.png" alt=""><div><b>Memory Harbor</b><small data-i18n="tagline">空间轻一点，历史留得住</small></div></div><label class="search-control"><span aria-hidden="true">⌕</span><input id="search" type="search" data-placeholder="searchPlaceholder" placeholder="查找项目、文件或过去的记录" autocomplete="off"><button id="clearSearch" type="button" data-aria="clearSearch" aria-label="清空搜索" hidden>×</button><kbd>⌘K</kbd></label><button id="settings" class="icon-button" type="button" data-aria="settings" aria-label="设备与设置">···</button></header>
<div class="workspace-meta"><span><span data-i18n="localFree">本机可用</span> <b id="free">—</b></span><button id="drivePicker" type="button" aria-haspopup="dialog"><i id="driveDot"></i><span id="driveName" data-i18n="checkingStorage">正在查看存储设备</span><span aria-hidden="true">›</span></button><input id="volume" type="hidden"></div>
<section class="content-panel"><div class="panel-head"><div><h1 data-i18n="yourContent">你的内容</h1><p id="inventorySummary" aria-live="polite" data-i18n="loading">正在查看本机目录…</p></div><button id="selectAll" data-i18n="selectAll">全选候选</button></div><div class="list-toolbar"><div class="tabs" role="group" data-aria="viewFilter"><button data-filter="eligible" class="active" data-i18n="candidates">建议停泊</button><button data-filter="linked" data-i18n="docked">已停泊</button><button data-filter="all" data-i18n="allContent">全部</button></div><label class="sort-control"><span data-i18n="sort">排序</span><select id="sortBy"><option value="size" data-i18n="largest">占用最大优先</option><option value="recent" data-i18n="oldest">最久未修改优先</option></select></label></div><p id="searchStatus" class="search-status" hidden></p><div id="projects" class="tree" aria-live="polite"></div><p class="list-note" data-i18n="ageRule">建议范围：30 天以上未修改的已完成子任务或素材。主任务、工作文件和标星内容留在本机。</p></section>
<footer class="actionbar"><div><b id="selected" data-i18n="selectContent">选择需要停泊的内容</b><span id="selectedSize">0 B</span><small data-i18n="confirmFirst">先看方案，确认后才迁移</small></div><button class="primary" id="offload" disabled data-i18n="review">查看停泊方案</button></footer></main>
<div id="toast" role="status"></div>
<dialog id="settingsDialog"><div class="dialog-heading"><h2 data-i18n="settings">设备与设置</h2><button class="icon-button" data-close="settingsDialog" data-aria="close">×</button></div><label class="setting-row"><span data-i18n="language">语言</span><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><label class="setting-row"><span data-i18n="appearance">外观</span><select id="theme"><option value="system" data-i18n="system">跟随系统</option><option value="dark" data-i18n="dark">深色</option><option value="light" data-i18n="light">浅色</option></select></label><h3 data-i18n="destination">存储目的地</h3><div id="driveMenu"></div><p class="storage-note" data-i18n="offlineNote">外盘在线时原路径可读；拔盘后原始内容暂时不可读。这不是云备份。</p><details><summary data-i18n="moreInfo">更多信息</summary><p id="catalogStatus"></p><p data-i18n="recallBoundary">搜索来自本机索引；不是完整历史自动记忆。素材只在你点击盘点时扫描。</p><button id="refresh" data-i18n="rescan">重新扫描本机目录</button></details><button id="compact" data-i18n="desktop">放回桌面</button></dialog>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><form method="dialog"><button value="cancel" data-i18n="cancel">取消</button><button value="ok" class="primary" id="confirmAction" data-i18n="confirm">确认</button></form></dialog>
<dialog id="taskDialog"><h2 id="taskDetailTitle"></h2><p id="taskDetailPreview"></p><div id="taskDetailMeta" class="task-detail-meta"></div><section id="taskRecord" hidden><b data-i18n="reports">子任务记录</b><div id="taskRecordMessages"></div></section><p class="storage-note" id="taskDetailHint"></p><form method="dialog"><button value="cancel" data-i18n="close">关闭</button><button type="button" id="openParentInCodex" hidden data-i18n="openParent">打开所属主任务</button><button type="button" class="primary" id="openInCodex" data-i18n="openCodex">在 Codex 中打开</button></form></dialog>
<dialog id="manageDialog"><h2 data-i18n="manage">管理已停泊内容</h2><p data-i18n="manageNote">恢复会把文件放回本机；释放副本只移除停泊时保留的本地副本，必须先通过校验。</p><div class="manage-actions"><button id="audit" data-i18n="audit">验证完整性</button><button id="restore" data-i18n="restore">恢复到本机</button><button id="finalize" class="danger" data-i18n="release">释放本地副本</button></div><form method="dialog"><button value="cancel" data-i18n="close">关闭</button></form></dialog>
<dialog id="progressDialog" class="progress-dialog"><img class="progress-mark" src="memory-harbor-logo-v4.png" alt=""><h2 id="progressTitle" data-i18n="docking">正在安全停泊</h2><p id="progressStage"></p><details id="transferReport" hidden><summary id="transferSummary" data-i18n="transferDetails">查看处理详情</summary><div id="transferDetails"></div></details><progress id="progressFill" max="100" value="0" data-aria="progress" aria-label="已验证完成的停泊进度"></progress><div class="progress-meta"><span id="progressCount">0 / 0</span><span id="progressBytes">0 B</span></div><button id="progressClose" disabled data-i18n="done">完成</button></dialog>
<script src="i18n.js"></script><script src="workbench-model.js"></script><script src="progress-model.js"></script><script src="app.js"></script></body></html>
