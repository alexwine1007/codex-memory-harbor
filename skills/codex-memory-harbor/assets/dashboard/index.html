<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Harbor</title><link rel="stylesheet" href="styles.css?v=0.4.5b2"></head>
<body><div class="glow one"></div><div class="glow two"></div><main>
<header><div class="brand"><div class="mark"><img src="memory-harbor-logo-v4.png" alt=""></div><div><b>Memory Harbor</b><span>你的智能工作历史</span></div></div><div class="header-actions"><div class="drive-control"><button class="drive-picker" id="drivePicker" type="button" aria-haspopup="listbox" aria-expanded="false"><i></i><span><small id="driveStatus">扫描中</small><b id="driveName">正在查找存储位置</b></span><span class="chevron"></span></button><div class="drive-menu" id="driveMenu" role="listbox" hidden></div><input id="volume" type="hidden"></div><button id="compact">放回桌面</button></div></header>
<section class="hero"><span class="kicker">新增可停泊的任务历史</span><strong id="eligible">—</strong><p id="heroText">正在查看你的历史，不读取完整对话正文。</p><div class="hero-actions"><button id="selectAll">查看候选历史</button><button id="optimize" hidden>查看历史停泊方案</button><button class="primary" id="projectShortcut">查看项目大素材</button></div></section>
<section class="summary"><article><span>内盘可用</span><b id="free">—</b><div class="bar"><i id="diskBar"></i></div></article><article><span>受保护历史</span><b id="protected">—</b><small>永不自动停泊</small></article><article><span>已停泊</span><b id="linked">—</b><small>外置盘在线即可读取</small></article><article><span>本地副本</span><b id="rollback">—</b><small>仅主动保留时产生</small></article></section>
<section class="panel"><div class="panel-head"><div><h2>你的内容</h2><p>当前连接 · Codex；<span id="catalogStatus">正在准备本地目录</span></p></div><div class="panel-tools"><label class="search-control"><span>⌕</span><input id="search" type="search" placeholder="搜索过去做过的事" autocomplete="off"><button id="clearSearch" type="button" hidden>×</button></label><label class="sort-control"><span>排序</span><select id="sortBy"><option value="size">占用大小</option><option value="recent">闲置时长（久 → 近）</option></select></label><button class="scan-button" id="refresh">重新查看</button><div class="tabs"><button data-filter="recommended" id="recommendedTab" hidden>本次建议</button><button data-filter="eligible" class="active">可以停泊</button><button data-filter="linked">已经停泊</button><button data-filter="all">全部历史</button></div></div></div><div id="projects" class="projects tree"></div></section>
</main><section class="actionbar"><div><b id="selected">未选择历史</b><span id="selectedSize">0 B</span></div><button class="primary" id="offload" disabled>选择历史后停泊</button></section><div id="toast"></div><dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><form method="dialog"><button value="cancel">取消</button><button value="ok" class="primary">确认</button></form></dialog><dialog id="taskDialog" class="task-dialog"><span class="task-dialog-kicker">历史对象</span><h3 id="taskDetailTitle">正在读取…</h3><p id="taskDetailPreview"></p><div class="task-detail-meta" id="taskDetailMeta"></div><section class="task-record" id="taskRecord" hidden><div class="task-record-head"><b>子任务记录</b><span id="taskRecordCount"></span></div><div id="taskRecordMessages"></div></section><small id="taskDetailHint">这里只读取 Codex 已生成的标题和短预览，不扫描完整对话正文。</small><form method="dialog"><button value="cancel">关闭</button><button type="button" id="openParentInCodex" hidden>打开所属主任务</button><button type="button" class="primary" id="openInCodex">在 Codex 中打开</button></form></dialog><dialog id="manageDialog" class="manage-dialog"><span class="task-dialog-kicker">已停泊历史</span><h3>管理所选历史</h3><p>这里管理停泊时主动保留的本地副本；普通停泊完成后不会保留待释放副本。</p><div class="manage-actions"><button id="audit">验证完整性<span>核对外置原件与本地副本</span></button><button id="restore">恢复到本机<span>重新变为内盘普通文件</span></button><button class="danger" id="finalize">释放本地副本<span>验证外置原件后释放空间</span></button></div><form method="dialog"><button value="cancel">关闭</button></form></dialog><dialog id="progressDialog" class="progress-dialog"><div class="progress-mark"><img src="memory-harbor-logo-v4.png" alt=""></div><h3 id="progressTitle">正在停泊</h3><p id="progressStage">准备安全校验…</p><div class="progress-track"><progress id="progressFill" max="100" value="0" aria-label="已验证完成的停泊进度"></progress></div><div class="progress-meta"><span id="progressCount">0 / 0</span><span id="progressBytes">0 B</span></div><button id="progressClose" disabled>完成</button></dialog><script src="progress-model.js"></script><script src="app.js"></script></body></html>
