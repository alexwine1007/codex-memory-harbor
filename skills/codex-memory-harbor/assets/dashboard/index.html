<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Memory Harbor</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="glow one"></div><div class="glow two"></div><main>
<header><div class="brand"><div class="mark">⌑</div><div><b>Memory Harbor</b><span>Codex 记忆港</span></div></div><div class="online"><i></i><span id="driveStatus">扫描中</span><button id="compact">放回桌面</button></div></header>
<section class="hero"><span class="kicker">建议可安全释放</span><strong id="eligible">—</strong><p id="heroText">正在分析 Codex 历史，不读取对话正文。</p><div class="hero-actions"><button id="selectAll">选择全部候选</button><button class="primary" id="plan">预演整理方案</button></div></section>
<section class="summary"><article><span>内盘可用</span><b id="free">—</b><div class="bar"><i id="diskBar"></i></div></article><article><span>受保护主任务</span><b id="protected">—</b><small>永不自动迁移</small></article><article><span>已停泊</span><b id="linked">—</b><small>原路径保持可读</small></article><article><span>待释放回滚</span><b id="rollback">—</b><small>确认后才腾出空间</small></article></section>
<section class="panel"><div class="panel-head"><div><h2>按项目整理</h2><p>选择不再活跃的项目；主任务与当前保护项目已自动排除。</p></div><div class="tabs"><button data-filter="eligible" class="active">待整理</button><button data-filter="linked">已停泊</button><button data-filter="all">全部</button></div></div><div id="projects" class="projects"></div></section>
<details class="advanced"><summary>高级设置与单文件信息</summary><div class="settings"><label>外挂盘<select id="volume"></select></label><label>静置至少<input id="age" type="number" min="1" value="30"><em>天</em></label><label>长期保留项目（每行一个）<textarea id="priority" placeholder="重要项目路径"></textarea></label><button id="refresh">重新扫描</button></div><div id="files" class="files"></div></details>
</main><section class="actionbar"><div><b id="selected">未选择项目</b><span id="selectedSize">0 B</span></div><div><button id="audit">校验</button><button id="restore">恢复</button><button class="danger" id="finalize">释放回滚</button><button class="primary" id="offload" disabled>开始迁移</button></div></section><div id="toast"></div><dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><form method="dialog"><button value="cancel">取消</button><button value="ok" class="primary">确认</button></form></dialog><script src="app.js"></script></body></html>
