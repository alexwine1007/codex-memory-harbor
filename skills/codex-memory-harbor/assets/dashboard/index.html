<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Harbor</title><link rel="stylesheet" href="styles.css?v=0.4.2b1"></head>
<body><div class="glow one"></div><div class="glow two"></div><main>
<header><div class="brand"><div class="mark"><img src="memory-harbor-logo-v4.png" alt=""></div><div><b>Memory Harbor</b><span>Codex 历史存储与召回</span></div></div><div class="header-actions"><div class="drive-control"><button class="drive-picker" id="drivePicker" type="button" aria-haspopup="listbox" aria-expanded="false"><i></i><span><small id="driveStatus">扫描中</small><b id="driveName">正在查找存储目的地</b></span><span class="chevron"></span></button><div class="drive-menu" id="driveMenu" role="listbox" hidden></div><input id="volume" type="hidden"></div><button id="compact">放回桌面</button></div></header>
<section class="hero"><span class="kicker">建议可安全释放</span><strong id="eligible">—</strong><p id="heroText">正在读取 Codex 任务索引，不扫描完整对话正文。</p><div class="hero-actions"><button id="selectAll">查看推荐</button><button class="primary optimize" id="optimize">一键优化</button></div></section>
<section class="summary"><article><span>内盘可用</span><b id="free">—</b><div class="bar"><i id="diskBar"></i></div></article><article><span>受保护主任务</span><b id="protected">—</b><small>永不自动迁移</small></article><article><span>已停泊</span><b id="linked">—</b><small>外置盘在线即可读取</small></article><article><span>本地备份</span><b id="rollback">—</b><small>仅勾选保留时产生</small></article></section>
<section class="panel"><div class="panel-head"><div><h2>Codex 存储内容</h2><p>项目与任务统一展示；<span id="catalogStatus">正在建立本地索引</span></p></div><div class="panel-tools"><label class="search-control"><span>⌕</span><input id="search" type="search" placeholder="搜索任务、项目或编号" autocomplete="off"><button id="clearSearch" type="button" hidden>×</button></label><label class="sort-control"><span>排序</span><select id="sortBy"><option value="size">占用大小</option><option value="recent">任务闲置时长（久 → 近）</option></select></label><button class="scan-button" id="refresh">重新扫描</button><div class="tabs"><button data-filter="recommended" id="recommendedTab" hidden>本次推荐</button><button data-filter="eligible" class="active">待整理</button><button data-filter="linked">已停泊</button><button data-filter="all">全部</button></div></div></div><div id="projects" class="projects tree"></div></section>
</main><section class="actionbar"><div><b id="selected">未选择任务</b><span id="selectedSize">0 B</span></div><button class="primary" id="offload" disabled>选择任务后整理</button></section><div id="toast"></div><dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><form method="dialog"><button value="cancel">取消</button><button value="ok" class="primary">确认</button></form></dialog><dialog id="taskDialog" class="task-dialog"><span class="task-dialog-kicker">Codex 任务</span><h3 id="taskDetailTitle">正在读取…</h3><p id="taskDetailPreview"></p><div class="task-detail-meta" id="taskDetailMeta"></div><section class="task-record" id="taskRecord" hidden><div class="task-record-head"><b>子任务记录</b><span id="taskRecordCount"></span></div><div id="taskRecordMessages"></div></section><small id="taskDetailHint">这里只读取 Codex 已生成的标题和短预览，不扫描完整对话正文。</small><form method="dialog"><button value="cancel">关闭</button><button type="button" id="openParentInCodex" hidden>打开所属主任务</button><button type="button" class="primary" id="openInCodex">在 Codex 中打开</button></form></dialog><dialog id="manageDialog" class="manage-dialog"><span class="task-dialog-kicker">已停泊任务</span><h3>管理所选任务</h3><p>这里管理迁移前主动保留的本地备份；已完成的普通迁移不会产生待释放副本。</p><div class="manage-actions"><button id="audit">检查完整性<span>核对外置原件与本地备份</span></button><button id="restore">恢复到电脑<span>重新变为内盘普通文件</span></button><button class="danger" id="finalize">删除本地备份<span>校验外置原件后释放空间</span></button></div><form method="dialog"><button value="cancel">关闭</button></form></dialog><dialog id="progressDialog" class="progress-dialog"><div class="progress-mark"><img src="memory-harbor-logo-v4.png" alt=""></div><h3 id="progressTitle">正在整理</h3><p id="progressStage">准备迁移…</p><div class="progress-track"><i id="progressFill"></i></div><div class="progress-meta"><span id="progressCount">0 / 0</span><span id="progressBytes">0 B</span></div><button id="progressClose" disabled>完成</button></dialog><script src="app.js"></script></body></html>
