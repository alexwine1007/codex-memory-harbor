<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Memory Harbor</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="glow one"></div><div class="glow two"></div><main>
<header><div class="brand"><div class="mark"><img src="memory-harbor-logo-v4.png" alt=""></div><div><b>Memory Harbor</b><span>Codex 记忆港</span></div></div><div class="header-actions"><div class="drive-control"><button class="drive-picker" id="drivePicker" type="button" aria-haspopup="listbox" aria-expanded="false"><i></i><span><small id="driveStatus">扫描中</small><b id="driveName">正在查找存储目的地</b></span><span class="chevron"></span></button><div class="drive-menu" id="driveMenu" role="listbox" hidden></div><input id="volume" type="hidden"></div><button id="compact">放回桌面</button></div></header>
<section class="hero"><span class="kicker">建议可安全释放</span><strong id="eligible">—</strong><p id="heroText">正在分析 Codex 历史，不读取对话正文。</p><div class="hero-actions"><button id="selectAll">查看推荐</button><button class="primary optimize" id="optimize">一键优化</button></div></section>
<section class="summary"><article><span>内盘可用</span><b id="free">—</b><div class="bar"><i id="diskBar"></i></div></article><article><span>受保护主任务</span><b id="protected">—</b><small>永不自动迁移</small></article><article><span>已停泊</span><b id="linked">—</b><small>外置盘在线即可读取</small></article><article><span>待释放回滚</span><b id="rollback">—</b><small>确认后才腾出空间</small></article></section>
<section class="panel"><div class="panel-head"><div><h2>按项目整理</h2><p>默认整理静置满 30 天的子任务；主任务与星标项目自动排除。</p></div><div class="panel-tools"><label class="sort-control"><span>排序</span><select id="sortBy"><option value="size">占用大小</option><option value="recent">最近活跃</option></select></label><button class="scan-button" id="refresh">重新扫描</button><div class="tabs"><button data-filter="recommended" id="recommendedTab" hidden>本次推荐</button><button data-filter="eligible" class="active">待整理</button><button data-filter="linked">已停泊</button><button data-filter="all">全部</button></div></div></div><div id="projects" class="projects"></div></section>
<details class="advanced"><summary>单任务保留与文件信息</summary><div id="files" class="files"></div></details>
</main><section class="actionbar"><div><b id="selected">未选择项目</b><span id="selectedSize">0 B</span></div><div><button id="audit">校验</button><button id="restore">恢复</button><button class="danger" id="finalize">释放回滚</button><button id="plan">预演</button><button class="primary" id="offload" disabled>开始迁移</button></div></section><div id="toast"></div><dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><form method="dialog"><button value="cancel">取消</button><button value="ok" class="primary">确认</button></form></dialog><dialog id="progressDialog" class="progress-dialog"><div class="progress-mark"><img src="memory-harbor-logo-v4.png" alt=""></div><h3 id="progressTitle">正在整理</h3><p id="progressStage">准备安全迁移…</p><div class="progress-track"><i id="progressFill"></i></div><div class="progress-meta"><span id="progressCount">0 / 0</span><span id="progressBytes">0 B</span></div><button id="progressClose" disabled>完成</button></dialog><script src="app.js"></script></body></html>
