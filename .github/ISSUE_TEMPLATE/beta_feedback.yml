name: Beta trial feedback / 内测反馈
description: Share a first-use result without private history or logs.
title: "[Trial] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please use disposable samples first. Do not upload private session logs, credentials, screenshots of private projects, full paths or drive UUIDs.
        请先用临时样例；不要上传私人聊天、凭据、私人项目截图、完整路径或硬盘 UUID。敏感安全问题请使用 SECURITY.md 的方式报告。
  - type: input
    id: version
    attributes:
      label: Version and macOS / 版本与系统
      placeholder: e.g. 0.4.6-beta.3, macOS 15
    validations:
      required: true
  - type: dropdown
    id: medium
    attributes:
      label: Drive type / 存储介质
      options:
        - Not used yet / 尚未使用
        - External SSD / 外置固态硬盘
        - External HDD / 外置机械硬盘
        - USB flash drive / U盘
        - Virtual test volume / 虚拟测试卷
        - Other or unknown / 其他或未知
  - type: input
    id: filesystem
    attributes:
      label: Filesystem / 文件系统
      placeholder: APFS, exFAT, unknown; no device identifiers
  - type: checkboxes
    id: outcomes
    attributes:
      label: Independently completed / 分别完成了什么
      options:
        - label: Read-only inventory / 只读盘点
        - label: Disposable trial passed / 临时样例通过
        - label: Original-path read checked / 原路径读取已核查
        - label: Restore checked / 恢复已核查
        - label: Codex restart checked separately / 另行验证 Codex 重启
        - label: Safe drive remount checked separately / 另行验证安全重挂载
        - label: Used voluntarily again after a week / 一周后自愿继续使用
  - type: textarea
    id: experience
    attributes:
      label: First confusing step or result / 第一个困惑的步骤或结果
      description: Tell us where you stopped; use redacted/disposable evidence only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私核查
      options:
        - label: I have removed personal history, secrets and identifying paths / 已移除私人记录、密钥及身份路径
          required: true
